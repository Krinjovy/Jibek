<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0B0A0C" />
  <title>JIBEK — Панель партнёра</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    body { background: #0B0A0C; color: #F5F5F5; font-family: system-ui, sans-serif; }
    .gold { color: #D3A625; }
    .card { background: #141416; border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-md mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <div class="text-xs tracking-[0.2em] uppercase text-white/40 mb-1">JIBEK.STORE</div>
      <h1 class="text-2xl font-bold">Панель партнёра</h1>
    </div>

    <div id="loginBox" class="card rounded-2xl p-5 space-y-4">
      <div>
        <label class="text-xs text-white/50 block mb-1.5">Промокод</label>
        <input id="loginCode" type="text" placeholder="ALIYA10" class="w-full bg-black/40 border border-white/15 rounded-xl px-4 py-3 text-sm uppercase outline-none focus:border-[#D3A625]" />
      </div>
      <div>
        <label class="text-xs text-white/50 block mb-1.5">PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" placeholder="••••" class="w-full bg-black/40 border border-white/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#D3A625]" />
      </div>
      <p id="loginError" class="text-xs text-red-400 hidden"></p>
      <button id="loginBtn" class="w-full py-3.5 rounded-xl bg-[#D3A625] text-[#0B0A0C] font-bold text-sm">Войти</button>
      <p class="text-[11px] text-white/35 text-center">Код и PIN выдаёт менеджер JIBEK</p>
    </div>

    <div id="dashBox" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-white/50">Партнёр</div>
          <div class="font-semibold text-lg" id="partnerName">—</div>
        </div>
        <button id="logoutBtn" class="text-xs text-white/40 underline">Выйти</button>
      </div>
      <div class="card rounded-2xl p-4">
        <div class="text-xs text-white/45 mb-1">Промокод</div>
        <div class="text-xl font-bold gold" id="partnerCode">—</div>
        <div class="mt-3 text-xs text-white/45 mb-1">Ссылка</div>
        <code id="partnerLink" class="text-[11px] text-white/70 break-all">—</code>
        <p class="text-[11px] text-white/35 mt-3">Клиент −10%. Тебе $10 с оплаченного заказа.</p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="card rounded-2xl p-4"><div class="text-[11px] text-white/45">Заказов</div><div class="text-2xl font-bold mt-1" id="statOrders">0</div></div>
        <div class="card rounded-2xl p-4"><div class="text-[11px] text-white/45">Оплачено</div><div class="text-2xl font-bold mt-1 gold" id="statPaid">0</div></div>
        <div class="card rounded-2xl p-4"><div class="text-[11px] text-white/45">К выплате</div><div class="text-2xl font-bold mt-1" id="statDue">$0</div></div>
        <div class="card rounded-2xl p-4"><div class="text-[11px] text-white/45">Выплачено</div><div class="text-2xl font-bold mt-1" id="statPaidOut">$0</div></div>
      </div>
      <div class="card rounded-2xl p-4">
        <div class="text-sm font-semibold mb-3">Заказы</div>
        <div id="ordersList" class="space-y-2 text-sm"><p class="text-white/40 text-xs">Пока нет заказов</p></div>
      </div>
      <p class="text-[11px] text-white/30 text-center" id="dataSourceHint">localStorage (демо)</p>
    </div>
  </div>
  <script>
    const cfg = window.JIBEK_CONFIG || {};
    const SESSION_KEY = 'jibek_partner_session';
    const ORDERS_KEY = 'jibek_orders';
    const PAYOUT = cfg.PARTNER_PAYOUT_USD || 10;
    function partnersMap() { return cfg.PARTNERS || {}; }
    function getLocalOrders(code) {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]').filter(o => (o.promo_code || '').toUpperCase() === code);
      } catch (e) { return []; }
    }
    function formatKzt(n) { return new Intl.NumberFormat('ru-KZ').format(n) + ' ₸'; }
    function formatDate(iso) {
      try { return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
      catch (e) { return iso; }
    }
    function showDash(code) {
      const p = partnersMap()[code];
      if (!p) return;
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashBox').classList.remove('hidden');
      document.getElementById('partnerName').textContent = p.name;
      document.getElementById('partnerCode').textContent = code;
      document.getElementById('partnerLink').textContent = 'https://jibek.store/?ref=' + code;
      const orders = getLocalOrders(code);
      const paid = orders.filter(o => o.status === 'paid');
      document.getElementById('statOrders').textContent = String(orders.length);
      document.getElementById('statPaid').textContent = String(paid.length);
      document.getElementById('statDue').textContent = '$' + (paid.length * PAYOUT);
      document.getElementById('statPaidOut').textContent = '$0';
      const list = document.getElementById('ordersList');
      if (!orders.length) list.innerHTML = '<p class="text-white/40 text-xs">Нет заказов по коду</p>';
      else list.innerHTML = orders.map(o => {
        const st = o.status === 'paid' ? '<span class="text-emerald-400">оплачен</span>' : '<span class="text-white/45">ожидает</span>';
        return '<div class="flex justify-between py-2 border-b border-white/5"><div><div>' + formatKzt(o.amount_kzt || 0) + '</div><div class="text-[11px] text-white/35">' + formatDate(o.created_at) + '</div></div><div class="text-[11px]">' + st + '</div></div>';
      }).join('');
    }
    document.getElementById('loginBtn').addEventListener('click', () => {
      const code = (document.getElementById('loginCode').value || '').toUpperCase().trim();
      const pin = (document.getElementById('loginPin').value || '').trim();
      const err = document.getElementById('loginError');
      const p = partnersMap()[code];
      if (!p || String(p.pin) !== pin) { err.textContent = 'Неверный код или PIN'; err.classList.remove('hidden'); return; }
      err.classList.add('hidden');
      sessionStorage.setItem(SESSION_KEY, code);
      showDash(code);
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('dashBox').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
    });
    const sess = sessionStorage.getItem(SESSION_KEY);
    if (sess && partnersMap()[sess]) showDash(sess);
  </script>
</body>
</html>
